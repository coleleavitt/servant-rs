# Servant Rs Workflow Add New Combinator Or Endpoint

## Action

Follow the add-new-combinator-or-endpoint workflow:
1. Update or add implementation files in servant/src/api/* and servant/src/lib.rs
2. Update or add related files in servant-client/src/client/*, servant-client/src/request.rs, and servant-client/src/lib.rs
3. Update or add related files in servant-server/src/extract/*, servant-server/src/serve.rs, servant-server/src/handler.rs, and servant-server/src/lib.rs
4. Update or add documentation support in servant-docs/src/* and servant-docs/src/walk/*
5. Update or add OpenAPI support in servant-openapi/src/*
6. Add or update tests in servant-client/tests/*, servant-server/tests/*, servant-docs/tests/*, and servant-openapi/tests/*
7. Add new module files if needed (e.g., servant/src/host.rs, servant/src/query/deep.rs)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: servant/src/api/args.rs, servant/src/api/combinators.rs, servant/src/api/constructors.rs

