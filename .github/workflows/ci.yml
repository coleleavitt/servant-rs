name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features

  coq-proofs:
    name: Risk-gate proof (Rocq/Coq)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Best-effort install of the prover. If it fails, the `verify` target is self-guarding
      # (skips with exit 0 when neither `rocq` nor `coqc` is on PATH), so CI never breaks on its
      # absence — but on a healthy runner this machine-checks proofs/RiskGate.v for real.
      - name: Install Coq (best-effort)
        run: sudo apt-get update && sudo apt-get install -y coq || echo "coq install failed; verify target will skip"

      - name: Machine-check the risk-gate proof
        run: make -C ponoma-server verify
