[workspace]
resolver = "2"
members = [
    "servant",
    "servant-server",
    "servant-client",
    "servant-docs",
    "servant-openapi",
    "servant-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "BSD-3-Clause"
repository = "https://github.com/cole/servant-rs"
description = "An idiomatic Rust port of Haskell Servant: one typed API description drives server routing, typed clients, links, and documentation."

[workspace.dependencies]
# Core HTTP ecosystem
http = "1"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
mime = "0.3"
percent-encoding = "2"

# Runtime / adapters
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "client-legacy", "http1", "service"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }

# Async plumbing
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pin-project-lite = "0.2"

# Codecs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Errors
thiserror = "2"

# Auth
base64 = "0.22"

# Internal crates
servant = { path = "servant", version = "0.1.0" }
servant-server = { path = "servant-server", version = "0.1.0" }
servant-client = { path = "servant-client", version = "0.1.0" }
servant-docs = { path = "servant-docs", version = "0.1.0" }
servant-openapi = { path = "servant-openapi", version = "0.1.0" }
servant-macros = { path = "servant-macros", version = "0.1.0" }

# Dev / test
proptest = "1"

[profile.dev]
# Faster iteration; tests still run with assertions.
opt-level = 0
